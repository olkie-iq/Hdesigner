<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Designer | معرض أعمالي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        /* إعدادات عامة */
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --accent: #f4f4f4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* قسم التعريف (Hero Section) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #fff 0%, #f9f9f9 100%);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            color: #555;
            font-weight: 300;
        }

        /* شبكة الأعمال (Portfolio) */
        .portfolio {
            padding: 100px 5%;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 60px;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 50px;
            height: 2px;
            background: #000;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: var(--accent);
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: #fff;
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .card:hover .card-info {
            transform: translateY(0);
        }

        /* قسم التواصل (Footer) */
        .contact {
            background: var(--primary);
            color: #fff;
            padding: 80px 5%;
            text-align: center;
        }

        .contact h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .social-links a {
            color: #fff;
